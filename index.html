<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Purpose Gate — Bruno the Vibe Samurai</title>
  <style>
    :root { --paper:#fff7f0; --ink:#241108; --muted:#6f5040; --deep:#050508; --gold:#a84318; --line:#e7cdbd; --card:#fffdfa; --wash:#ffe6d3; --clay:#c04e18; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px;
      color:var(--ink); background:radial-gradient(circle at 90% 6%,rgba(255,120,48,.13),transparent 25%),radial-gradient(circle at 5% 95%,rgba(192,78,24,.08),transparent 28%),var(--paper);
      font-family:Arial,Helvetica,sans-serif; }
    .card { width:100%; max-width:400px; padding:34px 28px; border:1px solid var(--line); border-top:3px solid var(--clay); background:var(--card); box-shadow:0 8px 30px rgba(80,40,10,.1); }
    .eyebrow { color:var(--gold); font-size:11px; font-weight:700; letter-spacing:.14em; text-transform:uppercase; }
    .rule { width:44px; height:3px; margin:10px 0 16px; background:linear-gradient(90deg,var(--deep),var(--gold)); }
    h1 { margin:0; color:var(--deep); font-family:Georgia,'Times New Roman',serif; font-size:26px; font-weight:500; line-height:1.15; }
    .sub { margin:12px 0 0; color:var(--muted); font-size:14.5px; line-height:1.5; }
    form { margin-top:22px; }
    input[type="password"] { width:100%; padding:13px 14px; border:1px solid var(--line); background:var(--paper); color:var(--ink); font-size:16px; font-family:inherit; }
    input[type="password"]:focus { outline:2px solid var(--gold); outline-offset:1px; }
    button { width:100%; margin-top:12px; padding:13px 14px; border:none; background:var(--gold); color:#fff7f0; font-size:14px; font-weight:700; letter-spacing:.04em; cursor:pointer; }
    button:hover { background:var(--clay); }
    button:disabled { opacity:.6; cursor:default; }
    .msg { margin-top:14px; font-size:13.5px; line-height:1.45; display:none; }
    .msg.error { color:var(--clay); display:block; }
    .msg.info { color:var(--muted); display:block; }
    .foot { margin-top:24px; padding-top:16px; border-top:1px solid var(--line); color:var(--muted); font-size:11px; letter-spacing:.1em; text-transform:uppercase; text-align:center; }
  </style>
</head>
<body>
  <div class="card">
    <div class="eyebrow">Purpose Gate · Private</div>
    <div class="rule"></div>
    <h1>Bruno the Vibe Samurai</h1>
    <p class="sub">This report is private. Enter the password you were given to view it.</p>
    <form id="gate-form">
      <input type="password" id="password" name="password" placeholder="Password" autocomplete="off" required>
      <button type="submit" id="submit-btn">View report</button>
      <div class="msg" id="msg"></div>
    </form>
    <div class="foot">luckify.me</div>
  </div>

  <script>
    const ARTIFACT_ID = '2d73720d-3155-4e7f-893d-285f89f037b1';
    const ENDPOINT = 'https://csuzkwiaykhlmeiogeel.supabase.co/functions/v1/public-report-access';

    const form = document.getElementById('gate-form');
    const msg = document.getElementById('msg');
    const btn = document.getElementById('submit-btn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const password = document.getElementById('password').value;
      if (!password) return;

      btn.disabled = true;
      btn.textContent = 'Checking...';
      msg.className = 'msg';
      msg.textContent = '';

      try {
        const res = await fetch(ENDPOINT, {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify({ artifactId: ARTIFACT_ID, password }),
        });

        const contentType = res.headers.get('content-type') || '';

        if (res.ok && contentType.includes('text/html')) {
          const html = await res.text();
          document.open();
          document.write(html);
          document.close();
          return;
        }

        const data = await res.json().catch(() => ({}));
        if (data.error === 'invalid_password') {
          msg.className = 'msg error';
          msg.textContent = 'That password isn\'t right. Double-check it and try again.';
        } else {
          msg.className = 'msg error';
          msg.textContent = 'This link isn\'t available right now. Please reach out and we\'ll help directly.';
        }
      } catch (err) {
        msg.className = 'msg error';
        msg.textContent = 'Something went wrong loading the report. Please try again in a moment.';
      } finally {
        btn.disabled = false;
        btn.textContent = 'View report';
      }
    });
  </script>
</body>
</html>
